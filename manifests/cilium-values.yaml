# Cilium on Talos. Talos locks down cgroups and capabilities differently
# than general purpose Linux, so these settings are required.
ipam:
  mode: kubernetes
kubeProxyReplacement: false   # keep kube-proxy for now; fewer moving parts
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
